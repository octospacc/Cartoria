name: Cartoria
description: A personal archive for notes, bookmarks, and files.
publish_to: 'none'
version: 1.0.3+7
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  fs_shim: ^2.7.0
  path: ^1.9.0
  path_provider: ^2.1.4
  uuid: ^4.4.0
  file_selector: ^1.0.3
  archive: ^3.6.1
  share_plus: ^10.0.2
  web: ^1.0.0
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  opengraph: ^1.5.0
  url_launcher: ^6.3.0
  html: ^0.15.4   # ← add
  http: ^1.2.0
  http_parser: ^4.0.2
  crypto: ^3.0.3
  scrollable_positioned_list: ^0.3.8
  package_info_plus: ^8.0.0
  emoji_picker_flutter: ^4.5.4

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#A0432B"
    theme_color: "#A0432B"

  macos:
    generate: true
    image_path: "assets/icon/icon.png"

  windows:
    generate: true
    image_path: "assets/icon/icon.png"

  adaptive_icon_background: "#A0432B"
  adaptive_icon_foreground: "assets/icon/icon-foreground.png"

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false